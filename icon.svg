<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title>VTube Shadowrun Icon</title>
    <desc>Shadowrun-style cyberpunk icon for a VTube application.</desc>
    <defs>
        <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffea"/>
            <stop offset="100%" stop-color="#ff1ed9"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" rx="40" ry="40" fill="#0d0d0d"/>

    <!-- Subtle grid -->
    <g stroke="#1a1a1a" stroke-width="1">
        <line x1="0" y1="64" x2="512" y2="64"/>
        <line x1="0" y1="128" x2="512" y2="128"/>
        <line x1="0" y1="192" x2="512" y2="192"/>
        <line x1="0" y1="256" x2="512" y2="256"/>
        <line x1="0" y1="320" x2="512" y2="320"/>
        <line x1="0" y1="384" x2="512" y2="384"/>
        <line x1="0" y1="448" x2="512" y2="448"/>
        <line x1="64" y1="0" x2="64" y2="512"/>
        <line x1="128" y1="0" x2="128" y2="512"/>
        <line x1="192" y1="0" x2="192" y2="512"/>
        <line x1="256" y1="0" x2="256" y2="512"/>
        <line x1="320" y1="0" x2="320" y2="512"/>
        <line x1="384" y1="0" x2="384" y2="512"/>
        <line x1="448" y1="0" x2="448" y2="512"/>
    </g>

    <!-- Stylized V with glitch lines -->
    <g filter="url(#glow)">
        <path d="M128 128 L256 384 L384 128" fill="none" stroke="url(#neon)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- glitch rectangles -->
        <rect x="150" y="200" width="60" height="8" fill="#00ffea"/>
        <rect x="300" y="260" width="80" height="8" fill="#ff1ed9"/>
    </g>
</svg>